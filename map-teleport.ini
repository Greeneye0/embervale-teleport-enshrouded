; Embervale Teleport 1.0.0 - map based teleport.
; Settings are read when the game or server starts.
[Teleport]
; false = terrain-top arrival after the one-time prank.
; true = regular high-altitude arrival, with normal glider, falling speed and
; fall damage. No joke messages or automatic correction to the ground.
DeluxeTeleports=false

[Prank]
; False = allow the one-time Embervale Teleport Services prank.
; True = No fun allowed: disable new pranks and use the selected teleport mode.
; First use is tracked per player account per host installation, across its worlds.
; Pending recovery still finishes. This does not hide teleport message banners.
NoFun=False

[Messages]
; Client display preference, also used when playing offline or hosting.
; True = show teleport notices, prank dialogue and the 3-2-1 banner countdown.
; False = hide all of this mod's message banners, including error notices.
; The map cursor ring, teleport behavior and protection/recovery still work.
; This does not disable the prank; use [Prank] NoFun=True for that.
; Applied when the mod loads (restart the game or hot reload while idle).
ShowBanners=True
